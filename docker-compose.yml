services:
  jekyll:
    image: ruby:3.2
    working_dir: /site
    command: >-
      bash -lc "
      bundle config set path vendor/bundle &&
      bundle install &&
      bundle exec jekyll serve
      --host 0.0.0.0
      --port 4000
      --livereload
      --force_polling
      --incremental
      "
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
