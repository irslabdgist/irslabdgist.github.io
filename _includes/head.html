<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Site relocated to https://dgist-irslab.github.io/ . Redirect every
       visitor to the new site. The new site uses a different URL structure
       (sub-paths like /team/ 404 there), so all old pages are sent to the
       new root rather than path-for-path. Delete this block to restore the
       old site. -->
  <meta http-equiv="refresh" content="0; url=https://dgist-irslab.github.io/">
  <link rel="canonical" href="https://dgist-irslab.github.io/">
  <script>window.location.replace("https://dgist-irslab.github.io/");</script>

  <title>IRS Lab — Intelligent Radio Sensing Lab @ DGIST</title>
  <meta name="description" content="Intelligent Radio Sensing (IRS) Lab at DGIST. AI-driven radio sensing, multimodal perception, and physical-world intelligence led by Prof. Jae-Ho Choi.">
  <meta property="og:title" content="IRS Lab — Intelligent Radio Sensing Lab @ DGIST">
  <meta property="og:description" content="Intelligent Radio Sensing (IRS) Lab at DGIST. AI-driven radio sensing, multimodal perception, and physical-world intelligence led by Prof. Jae-Ho Choi.">
  <meta property="og:url" content="https://dgist-irslab.github.io/">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- AOS (Animate On Scroll) -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ "/css/custom.css" | prepend: site.baseurl | prepend: site.url }}">

  <!-- Theme initialization (prevent flash) -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
