name: Sync Notion to Jekyll Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: _scripts/notion-sync/package-lock.json

      - name: Install dependencies
        working-directory: _scripts/notion-sync
        run: npm ci

      - name: Run sync
        id: sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_PUB_INTL: ${{ secrets.NOTION_PAGE_PUB_INTL }}
          NOTION_PAGE_PUB_NATIONAL: ${{ secrets.NOTION_PAGE_PUB_NATIONAL }}
          NOTION_PAGE_MEMBERS: ${{ secrets.NOTION_PAGE_MEMBERS }}
        run: node _scripts/notion-sync/sync.mjs

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync[bot]@users.noreply.github.com"
          git add _data/publist_international.yml _data/publist_national.yml _data/member_all.yml
          git commit -m "sync: update from Notion (${{ steps.sync.outputs.changes }})"
          git push

      - name: Notify Slack
        if: steps.sync.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":arrows_counterclockwise: IRS Lab 웹사이트 자동 업데이트\\n변경: ${{ steps.sync.outputs.changes }}\\nhttps://irslabdgist.github.io\"}"
